name: Historical rich-information backfill Run 1

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir . ruff==0.12.12 mypy==1.17.1
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy
      - run: git diff --check

  canary-binance:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: write}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        asset: [BTC, ETH, SOL, XRP, DOGE, BNB, HYPE]
    concurrency:
      group: historical-run-1-canary-${{ matrix.asset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill canary-asset --asset '${{ matrix.asset }}'

  canary-coinbase:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write}
    concurrency:
      group: historical-run-1-canary-coinbase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill canary-coinbase

  arena-pilot:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write}
    concurrency:
      group: historical-run-1-arena-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill arena-pilot

  production-btc:
    needs: [canary-binance, canary-coinbase]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {contents: write}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment:
          - {start: '2026-06-01', end: '2026-06-11'}
          - {start: '2026-06-11', end: '2026-06-21'}
          - {start: '2026-06-21', end: '2026-07-01'}
          - {start: '2026-07-01', end: '2026-07-09'}
    concurrency:
      group: historical-run-1-stage-btc-${{ matrix.segment.start }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill segment --asset BTC --start '${{ matrix.segment.start }}' --end '${{ matrix.segment.end }}'

  production-other-assets:
    needs: [canary-binance, canary-coinbase]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {contents: write}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        asset: [ETH, SOL, XRP, DOGE, BNB, HYPE]
        segment:
          - {start: '2026-06-01', end: '2026-06-11'}
          - {start: '2026-06-11', end: '2026-06-21'}
          - {start: '2026-06-21', end: '2026-07-01'}
          - {start: '2026-07-01', end: '2026-07-09'}
    concurrency:
      group: historical-run-1-stage-${{ matrix.asset }}-${{ matrix.segment.start }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill segment --asset '${{ matrix.asset }}' --start '${{ matrix.segment.start }}' --end '${{ matrix.segment.end }}'

  production-coinbase:
    needs: [canary-binance, canary-coinbase]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: write}
    concurrency:
      group: historical-run-1-stage-coinbase-btc
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill coinbase

  certify-btc:
    needs: [production-btc, production-coinbase]
    if: ${{ always() && needs.production-btc.result == 'success' && needs.production-coinbase.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write}
    concurrency:
      group: historical-run-1-btc-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill assemble-btc

  assemble:
    needs: [production-btc, production-other-assets, production-coinbase]
    if: ${{ always() && needs.production-btc.result == 'success' && needs.production-other-assets.result == 'success' && needs.production-coinbase.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write}
    concurrency:
      group: historical-run-1-canonical-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: historical-backfill assemble
