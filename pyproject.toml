[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "polymarket-historical-rich-information"
version = "1.0.0"
description = "Finite historical evidence acquisition for Polymarket 5-minute residual research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow==21.0.0"]

[project.scripts]
historical-backfill = "historical_backfill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/historical_backfill"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
